<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🟣 独自試験完全攻略ドリル｜就活の木</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6d28d9;--purple-mid:#7c3aed;--purple-pale:#F5F3FF;
  --violet:#5b21b6;--violet-mid:#8b5cf6;
  --amber:#F59E0B;--gray:#6B7280;--white:#fff;
  --shadow:0 2px 8px rgba(0,0,0,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#F5F3FF;min-height:100vh;color:#1F2937;}

#apiBar{background:linear-gradient(135deg,#4c1d95,#6d28d9);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:999;}
#apiBar span{color:#fff;font-size:12px;font-weight:700;white-space:nowrap;}
#apiKeyInput{flex:1;min-width:160px;padding:7px 12px;border-radius:8px;border:none;font-size:12px;outline:none;}
.api-btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.api-save{background:#22c55e;color:#fff;}
.api-clear{background:rgba(255,255,255,0.2);color:#fff;}
#apiStatus{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;}

.hero{background:linear-gradient(150deg,#4c1d95,#7c3aed);padding:28px 20px;text-align:center;color:#fff;}
.hero h1{font-size:24px;font-weight:900;margin-bottom:6px;}
.hero p{font-size:13px;opacity:0.85;line-height:1.7;}

.tab-bar{background:#fff;border-bottom:2px solid #E5E7EB;position:sticky;top:44px;z-index:990;display:flex;}
.tab-btn{padding:12px 24px;font-size:13px;font-weight:700;color:var(--gray);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;}
.tab-btn.active{color:var(--purple-mid);border-bottom-color:var(--purple-mid);}
.tab-btn:hover:not(.active){color:#374151;background:#F5F3FF;}

.content{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.score-bar{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.score-num{font-size:20px;font-weight:900;color:var(--purple-mid);}
.score-num span{font-size:12px;color:var(--gray);font-weight:400;}
.progress{flex:1;min-width:100px;height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple-mid),#c4b5fd);border-radius:4px;transition:width 0.4s;}
.score-pct{font-size:11px;color:var(--gray);}
.btn-reset{padding:6px 12px;background:var(--purple-pale);border:1px solid #DDD6FE;color:var(--purple);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}

.q-card{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.q-head{padding:12px 14px 8px;border-bottom:1px solid #F0F0F0;display:flex;gap:8px;align-items:flex-start;}
.q-num{background:var(--purple-mid);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;flex-shrink:0;}
.q-num.ai{background:#7C3AED;}
.q-num.sakumon{background:var(--violet-mid);}
.q-text{font-size:13px;font-weight:700;line-height:1.65;}
.q-body{padding:10px 14px 12px;}
.choices{display:flex;flex-direction:column;gap:6px;}
.choice{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;border:1.5px solid #E5E7EB;background:#FAFAFA;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.15s;width:100%;text-align:left;}
.choice:hover:not(:disabled){border-color:var(--purple-mid);background:var(--purple-pale);color:var(--purple);}
.choice-lbl{width:20px;height:20px;border-radius:50%;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:all 0.15s;}
.choice:hover:not(:disabled) .choice-lbl{background:var(--purple-mid);color:#fff;}
.choice.ok{border-color:#22c55e;background:#F0FDF4;color:#15803d;}
.choice.ok .choice-lbl{background:#22c55e;color:#fff;}
.choice.ng{border-color:#ef4444;background:#FEF2F2;color:#991b1b;}
.choice.ng .choice-lbl{background:#ef4444;color:#fff;}
.choice.show{border-color:#22c55e;background:#F0FDF4;color:#15803d;}
.choice.show .choice-lbl{background:#22c55e;color:#fff;}
.choice:disabled{cursor:default;}
.exp{margin-top:8px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.75;}
.exp.ok{background:linear-gradient(135deg,#F0FDF4,#DCFCE7);border:1px solid #BBF7D0;color:#14532d;}
.exp.ng{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:1px solid #FDE68A;color:#78350f;}
.exp-head{font-size:11px;font-weight:700;margin-bottom:3px;}

.section-head{font-size:11px;font-weight:700;color:var(--gray);letter-spacing:0.08em;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
.section-head span{flex:1;height:1px;background:#DDD6FE;display:block;}

.ai-section{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-top:20px;overflow:hidden;}
.ai-head{background:linear-gradient(135deg,#0e7490,#0891b2);padding:14px 18px;display:flex;align-items:center;gap:10px;}
.ai-head-icon{font-size:24px;}
.ai-head-title{color:#fff;font-size:14px;font-weight:900;}
.ai-head-sub{color:rgba(255,255,255,0.8);font-size:11px;margin-top:2px;}
.ai-body{padding:16px 18px;}
.ai-note{font-size:11px;color:var(--gray);background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:7px 10px;margin-bottom:12px;}
.ai-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.diff-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.diff-normal{background:#F0FDF4;border-color:#BBF7D0;color:#15803d;}
.diff-normal.on{background:#16a34a;color:#fff;}
.diff-hard{background:#F5F3FF;border-color:#C4B5FD;color:#7C3AED;}
.diff-hard.on{background:#7C3AED;color:#fff;}
.btn-gen{padding:9px 20px;background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.btn-gen:hover{transform:translateY(-2px);}
.btn-gen:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.ai-loading{text-align:center;padding:18px;color:#0891b2;font-size:13px;font-weight:600;}

.powerup{background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border:2px solid var(--purple-mid);border-radius:14px;padding:16px 18px;margin:20px 0;text-align:center;}
.powerup-title{font-size:14px;font-weight:900;color:var(--purple);margin-bottom:6px;}
.powerup-sub{font-size:12px;color:#374151;line-height:1.7;margin-bottom:10px;}
.powerup-cta{background:linear-gradient(135deg,#0e7490,#0891b2);border-radius:10px;padding:12px 16px;color:#fff;}
.powerup-cta-title{font-size:14px;font-weight:900;margin-bottom:4px;}
.powerup-cta-sub{font-size:12px;opacity:0.9;line-height:1.7;}
.powerup-cta a{color:#fde68a;font-weight:700;}

.result{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:24px;text-align:center;margin-bottom:16px;}
.result-emoji{font-size:44px;margin-bottom:8px;}
.result-score{font-size:38px;font-weight:900;color:var(--purple-mid);}
.result-score span{font-size:15px;color:var(--gray);font-weight:400;}
.result-pct{font-size:22px;font-weight:900;margin:4px 0 10px;}
.doshi{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:12px 14px;text-align:left;margin:10px 0;}
.doshi-lbl{font-size:10px;font-weight:700;color:#92400E;margin-bottom:4px;display:block;}
.doshi p{font-size:12px;color:#78350F;font-style:italic;line-height:1.75;}
.btn-retry{padding:10px 24px;background:linear-gradient(135deg,var(--purple),var(--purple-mid));color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;}

.footer{text-align:center;padding:0 16px 40px;font-size:11px;color:var(--gray);}
.footer b{color:var(--purple-mid);}

@media(max-width:480px){
  .hero{padding:22px 14px;}
  .content{padding:16px 12px 50px;}
  .q-text{font-size:12px;}
  .choice{font-size:12px;padding:8px 10px;}
  .tab-btn{padding:10px 14px;font-size:12px;}
}
</style>
</head>
<body>

<div id="apiBar">
  <span>🔑 Groq APIキー：</span>
  <input id="apiKeyInput" type="password" placeholder="gsk_... を入力して保存"/>
  <button class="api-btn api-save" onclick="saveKey()">💾 保存</button>
  <button class="api-btn api-clear" onclick="clearKey()">🗑️</button>
  <span id="apiStatus"></span>
</div>

<div class="hero">
  <h1>🟣 独自試験 完全攻略ドリル</h1>
  <p>論理・推論・作文・小論文｜2分野まとめて対策<br>固定問題 ＋ AI無限出題（普通・難関）</p>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('ronri',this)">🧠 論理・推論</button>
  <button class="tab-btn" onclick="switchTab('sakumon',this)">✍️ 作文・小論文</button>
</div>

<div class="content">

  <div id="tab-ronri" class="tab-panel active">
    <div class="score-bar">
      <div>
        <div style="font-size:11px;color:var(--gray);margin-bottom:2px;">スコア</div>
        <div class="score-num" id="score-ronri">0<span> / 0問</span></div>
      </div>
      <div style="flex:1;min-width:100px;">
        <div class="progress"><div class="progress-fill" id="prog-ronri" style="width:0%"></div></div>
        <div class="score-pct" id="pct-ronri" style="margin-top:3px;">0% 正答率</div>
      </div>
      <button class="btn-reset" onclick="resetAll('ronri')">🔄 リセット</button>
    </div>
    <div id="main-ronri"></div>
  </div>

  <div id="tab-sakumon" class="tab-panel">
    <div class="score-bar">
      <div>
        <div style="font-size:11px;color:var(--gray);margin-bottom:2px;">スコア</div>
        <div class="score-num" id="score-sakumon">0<span> / 0問</span></div>
      </div>
      <div style="flex:1;min-width:100px;">
        <div class="progress"><div class="progress-fill" id="prog-sakumon" style="width:0%"></div></div>
        <div class="score-pct" id="pct-sakumon" style="margin-top:3px;">0% 正答率</div>
      </div>
      <button class="btn-reset" onclick="resetAll('sakumon')">🔄 リセット</button>
    </div>
    <div id="main-sakumon"></div>
  </div>

</div>

<div class="footer"><b>🌱 就活の木</b>｜多摩大学キャリア支援課｜キャリ爺作成 ／ <a href="index.html" style="color:var(--purple-mid);">← トップに戻る</a></div>

<script>
const QS = {
  ronri: [
    {q:'次の論理推論で正しい結論はどれか。\n前提1：全てのコンサルタントは論理的思考力が高い。\n前提2：山田さんはコンサルタントだ。',c:['山田さんは数学が得意だ','山田さんは論理的思考力が高い','山田さんは外国語が話せる','山田さんは有名大学出身だ'],a:1,exp:'三段論法：全コンサルタントが論理的で、山田さんはコンサルタントなので、山田さんは論理的思考力が高い。'},
    {q:'AならばB、かつ、BならばCが真のとき、必ず真といえる命題はどれか。',c:['CならばA','AならばC','BならばA','CならばB'],a:1,exp:'AからBかつBからCが真ならば、AからCも真（三段論法）。'},
    {q:'5人（A〜E）が試験を受けた。\n条件1：AはBより点数が高い\n条件2：DはCより点数が低い\n条件3：BとCは同じ点数\n条件4：EはAより点数が高い\n\n最も点数が高いのは誰か？',c:['A','B','D','E'],a:3,exp:'E>A>B=C>D。条件4のE>Aが最も大きいので、最高点はE。'},
    {q:'MECEとはどのような概念か。',c:['モレなく・ダブりなく物事を分類・整理する考え方','全ての選択肢を均等に評価する手法','最も重要な要因を一つに絞る分析手法','反対意見を積極的に取り入れる議論法'],a:0,exp:'MECE（Mutually Exclusive, Collectively Exhaustive）はモレなく・ダブりなく。ロジカルシンキングの基本。'},
    {q:'クリティカルシンキングにおいて重要な姿勢はどれか。',c:['権威ある人の意見を無条件に信頼する','前提・根拠・論理の飛躍を客観的に検証・評価する姿勢','一つの情報源のみを深く調べる','感情に基づいて判断する'],a:1,exp:'クリティカルシンキングは前提・証拠・論理の妥当性を客観的・批判的に評価する思考法。'},
    {q:'確証バイアスとはどのような心理現象か。',c:['自分に都合の悪い情報を意図的に消す行為','自分の既存の信念を支持する情報ばかりを集め、反証情報を無視する傾向','他人の意見に流されやすい心理','新しい情報を拒絶する傾向'],a:1,exp:'確証バイアスは自分の仮説・信念を支持する情報を優先し、反証情報を軽視する認知の歪み。'},
    {q:'ロジックツリーとはどのような思考ツールか。',c:['会議の進行を管理するツール','問題・課題を樹状に分解して原因・解決策を整理するMECEな分析ツール','数値データを視覚化するグラフ','チームの役割分担を整理するツール'],a:1,exp:'ロジックツリーは問題をMECEに分解しながら樹状に整理するフレームワーク。'},
    {q:'次の文章の論理的誤りを指摘せよ。\n「A君はスポーツが得意だから、勉強もできるはずだ。」',c:['論理的に正しい','スポーツ能力と学習能力の関連を前提なく仮定する早まった類推の誤り','A君への偏見だ','スポーツと勉強は無関係である'],a:1,exp:'スポーツが得意なら勉強もできるという関係性は論理的前提がなく、早まった類推の誤り。'},
    {q:'仮説思考とはどのような思考プロセスか。',c:['全てのデータを集めてから結論を出す','最初に仮説を立て、それを検証する効率的な問題解決アプローチ','直感に従って素早く決断する','権威者の意見を前提として分析する'],a:1,exp:'仮説思考は全データ収集前に仮説を立てて検証・修正を繰り返す手法。限られた情報・時間での意思決定に有効。'},
    {q:'ゼロサムゲームとはどのような状況か。',c:['全員が利益を得られる状況','一方が得をすれば他方が同額の損をする状況（総和がゼロ）','利益も損失もない均衡状態','協力することで全員が利益を得られる状況'],a:1,exp:'ゼロサムゲームは利得の総和が常にゼロになる状況。一方の得は他方の損。'},
    {q:'演繹推論と帰納推論の違いとして正しいものはどれか。',c:['演繹は具体例から一般法則を導き、帰納は一般法則から結論を導く','演繹は一般法則から特定の結論を導き、帰納は具体例から一般法則を導く','どちらも同じ推論方法','演繹は感情的、帰納は論理的な推論'],a:1,exp:'演繹は一般から特殊（必然的）。帰納は特殊から一般（確率的）。'},
    {q:'次の論理パズルで正しいものを選べ。\n「全ての猫は動物だ。一部の動物は犬だ。」\n\nこの2文から確実に言えることはどれか？',c:['一部の猫は犬だ','全ての犬は猫だ','猫と犬は全く別の生き物だ','一部の猫は動物だ、は確実に言える'],a:3,exp:'全ての猫は動物なので、一部の猫も動物であることは確実に言える。猫と犬の関係は不明。'},
  ],
  sakumon: [
    {q:'「AI社会における人間の役割」の小論文で最も優れた論述構成はどれか。',c:['AIの危険性だけを論じる','AIと人間の違いを整理した上で人間固有の能力を活かした役割を具体的に示す','AIの歴史を詳細に述べる','AIを全面禁止すべきと主張する'],a:1,exp:'小論文は「問題提起→分析→自分の立場・主張→具体的根拠→結論」の流れが基本。多角的分析と具体性が高評価。'},
    {q:'作文で「自分の強み」を効果的に伝えるためのポイントとして最も適切なものはどれか。',c:['「明るい」「元気」などの抽象的な表現を繰り返す','具体的なエピソード＋その強みが発揮された場面＋仕事への活かし方をセットで述べる','強みを10個以上列挙する','他人と比べて優れていることだけを書く'],a:1,exp:'自己PR作文は「強み（結論）＋具体的エピソード（根拠）＋仕事への活かし方（展望）」のSTAR構造が効果的。'},
    {q:'「志望動機」の作文で最も評価される内容はどれか。',c:['給与や福利厚生への期待を率直に書く','企業研究に基づく具体的な志望理由＋自分の経験・強みとの接続＋入社後にやりたいことを論理的に述べる','「御社が好き」という感情を繰り返す','競合他社との比較で御社を選んだ理由だけを書く'],a:1,exp:'志望動機は①なぜその業界②なぜその企業③自分の何が活かせるか④入社後何をしたいか、の4点を具体的に繋げることが重要。'},
    {q:'「少子化対策」をテーマにした小論文の論述として最も優れているものはどれか。',c:['少子化は解決不可能と結論付ける','少子化の現状・原因を多角的に分析し、複数の視点から具体的な対策と課題を論じる','外国人を増やすことだけを提案する','出生率の数字だけを羅列する'],a:1,exp:'社会問題の小論文は「現状把握→原因分析→多角的な対策提案→課題・反論→結論」の構成が高評価。'},
    {q:'作文・小論文で「起承転結」の「転」の役割として最も適切なものはどれか。',c:['結論を述べる段落','問題提起をする段落','主張に対する反論・異なる視点を示し論の深みを出す段落','具体例を羅列する段落'],a:2,exp:'「転」は逆説・反論・別の視点を導入し議論に深みを与える。「確かに〜だが、しかし〜」が典型パターン。'},
    {q:'「PREP法」の構成として正しいものはどれか。',c:['Problem→Reason→Example→Point','Point→Reason→Example→Point','Purpose→Result→Evidence→Plan','Problem→Result→Explanation→Plan'],a:1,exp:'PREP法は「Point（主張）→Reason（理由）→Example（具体例）→Point（再主張）」の論述構成。論理的で説得力が高い。'},
    {q:'作文で「具体例」を使う目的として最も適切なものはどれか。',c:['字数を増やすため','抽象的な主張を具体的・説得力ある根拠で支え、読み手の理解と納得を助けるため','文章を複雑に見せるため','知識の広さをアピールするため'],a:1,exp:'具体例は主張を支える根拠。「主張→なぜなら→具体例→だから→結論」の流れで主張に説得力を持たせる。'},

    {q:'「SDGsと企業の役割」についての小論文で高評価を得るためのポイントとして正しいものはどれか。',c:['SDGsの17目標を全て列挙する','SDGsの意義を踏まえた上で、企業が取り組むべき具体的な実践例とESG経営・社会的責任の観点から自分の考えを論じる','「SDGsは重要」と繰り返す','企業利益を優先すべきと主張する'],a:1,exp:'SDGs論文は定義の確認（知識）＋企業事例（具体性）＋自分の考え（主体性）の三層構造が高評価。'},
    {q:'「作文の推敲（すいこう）」において最も重要な確認事項はどれか。',c:['文字数を減らすこと','論理の一貫性・根拠の妥当性・誤字脱字・読みやすさ・制限字数の確認を行うこと','できるだけ多くの修正を加えること','書き直しは行わないこと'],a:1,exp:'推敲は①論旨の一貫性②根拠の妥当性③誤字脱字④文体の統一⑤字数確認の5点が基本チェックリスト。'},
    {q:'「グローバル化時代に必要なスキル」についての作文で、論述の焦点として最も適切なものはどれか。',c:['英語力だけが必要と断言する','語学力・異文化理解・自己発信力・変化への適応力など複数のスキルを挙げ、自分の経験と結び付けて具体的に論じる','日本語さえできれば十分と主張する','グローバル化を批判する'],a:1,exp:'グローバル化論文はスキルを多面的に示した上で、自分の経験から「自分にとってのグローバルスキル」を具体的に論じると説得力が増す。'},
  ]
};

const AI_PROMPTS = {
  ronri: {
    sys: 'あなたは就職活動の独自試験（論理・推論分野）の問題作成専門家です。就活生向けの論理・推論問題（三段論法・批判的思考・論理パズル・ビジネスフレームワーク）を以下の難易度基準で5問作成してください。【普通】前提条件が2つ以内・推論ステップが2段階以内・選択肢が明確に判別できるレベル。【難関】前提条件が3つ以上・推論ステップが3段階以上・複数の条件を組み合わせて矛盾を排除するレベル。必ずJSON形式のみで返答。形式：{"questions":[{"q":"問題文","c":["A","B","C","D"],"a":正解インデックス(0-3),"exp":"解説（80字以内）"}]}',
    label: '独自試験 論理・推論'
  },
  sakumon: {
    sys: 'あなたは就職活動の独自試験（作文・小論文分野）の問題作成専門家です。就活生向けの作文・小論文対策問題（論述構成・評価ポイント・テーマ別の考え方）を以下の難易度基準で5問作成してください。【普通】身近なテーマ・論述の基本構成（序論・本論・結論）の知識・高校生レベルの表現力で解けるレベル。【難関】社会問題や抽象的テーマ・論理的根拠が必要・複数の視点から考察が求められる大学入試〜就活上級レベル。必ずJSON形式のみで返答。形式：{"questions":[{"q":"問題文","c":["A","B","C","D"],"a":正解インデックス(0-3),"exp":"解説（80字以内）"}]}',
    label: '独自試験 作文・小論文'
  }
};

const KEY = 'shukatsu_groq_key';
const state = {
  ronri:   { answered:{}, aiAnswered:{}, aiQs:[], diff:'normal', aiLoading:false },
  sakumon: { answered:{}, aiAnswered:{}, aiQs:[], diff:'normal', aiLoading:false },
};

function getKey(){ return sessionStorage.getItem(KEY)||''; }
function saveKey(){
  const k=document.getElementById('apiKeyInput').value.trim();
  if(!k){showSt('❌ キーを入力してください','#fca5a5');return;}
  if(!k.startsWith('gsk_')){showSt('⚠️ gsk_で始まるGroqキーを入力してください','#fde68a');return;}
  sessionStorage.setItem(KEY,k);
  document.getElementById('apiKeyInput').value='';
  showSt('✅ 保存済み！AI出題が使えます','#86efac');
}
function clearKey(){
  sessionStorage.removeItem(KEY);
  showSt('🗑️ 削除しました','#e5e7eb');
}
function showSt(msg,color){
  const el=document.getElementById('apiStatus');
  el.style.color=color;el.textContent=msg;
  setTimeout(()=>{if(el.textContent===msg)el.textContent='';},5000);
}
window.addEventListener('load',()=>{
  if(getKey()) showSt('✅ APIキー設定済み','#86efac');
  renderAll();
});

function switchTab(tab,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

async function callGemini(sys,usr){
  const key=getKey();
  if(!key) return null;
  const url='https://api.groq.com/openai/v1/chat/completions';
  const res=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({
      model:'llama-3.3-70b-versatile',
      messages:[{role:'system',content:sys},{role:'user',content:usr}],
      max_tokens:2000,temperature:0.7
    })
  });
  if(res.status===429) throw new Error('Groqのレート制限に達しました。しばらく待ってから再試行してください。');
  if(!res.ok) throw new Error('APIエラー: '+res.status);
  const data=await res.json();
  return data.choices[0].message.content;
}

function updateScore(tab){
  const s=state[tab];
  const qs=QS[tab];
  let correct=0,done=0;
  Object.values(s.answered).forEach(a=>{if(a.ok)correct++;done++;});
  Object.values(s.aiAnswered).forEach(a=>{if(a.ok)correct++;done++;});
  document.getElementById('score-'+tab).innerHTML=`${correct}<span> / ${done}問</span>`;
  const pct=done>0?Math.round(correct/done*100):0;
  document.getElementById('prog-'+tab).style.width=Math.min(done/qs.length*100,100)+'%';
  document.getElementById('pct-'+tab).textContent=`${pct}% 正答率（${done}/${qs.length}問回答済み）`;
}

function renderCard(q,i,ans,isAI,tab){
  const done=ans!==undefined;
  const labels=['A','B','C','D'];
  const numCls=isAI?'q-num ai':(tab==='sakumon'?'q-num sakumon':'q-num');
  const numLbl=isAI?`AI-${i+1}`:`Q${i+1}`;
  const choices=q.c.map((c,ci)=>{
    let cls='choice';
    if(done){
      if(ci===q.a) cls+=' show';
      else if(ci===ans.chosen&&!ans.ok) cls+=' ng';
    }
    const fn=isAI?`answerAI('${tab}',${i},${ci})`:`answer('${tab}',${i},${ci})`;
    return `<button class="${cls}" ${done?'disabled':''} onclick="${fn}">
      <span class="choice-lbl">${labels[ci]}</span><span>${c}</span>
    </button>`;
  }).join('');
  let expHtml='';
  if(done){
    const ok=ans.ok;
    expHtml=`<div class="exp ${ok?'ok':'ng'}">
      <div class="exp-head">${ok?'✅ 正解！':`❌ 不正解。正解：「${q.c[q.a]}」`}</div>
      ${q.exp}
    </div>`;
  }
  return `<div class="q-card">
    <div class="q-head"><span class="${numCls}">${numLbl}</span><div class="q-text">${q.q}</div></div>
    <div class="q-body"><div class="choices">${choices}</div>${expHtml}</div>
  </div>`;
}

function answer(tab,qi,chosen){
  state[tab].answered[qi]={chosen,ok:chosen===QS[tab][qi].a};
  render(tab);updateScore(tab);
}
function answerAI(tab,qi,chosen){
  state[tab].aiAnswered[qi]={chosen,ok:chosen===state[tab].aiQs[qi].a};
  render(tab);updateScore(tab);
}

async function generateAI(tab){
  const s=state[tab];
  const p=AI_PROMPTS[tab];
  const diffLabel=s.diff==='hard'?'難関（応用・高難度）':'普通（標準レベル）';
  const usr=`上記の難易度基準で${diffLabel}の問題を5問。必ずJSON形式のみで返答。他のテキスト一切不要。`;
  // ★クリア処理
  s.aiQs=[];s.aiAnswered={};s.aiLoading=true;
  render(tab);
  let retryCount=0;
  const maxRetry=2;
  while(retryCount<=maxRetry){
    try{
      const text=await callGemini(p.sys,usr);
      const match=text.match(/{[\s\S]*}/);
      if(!match) throw new Error('JSON_PARSE');
      const parsed=JSON.parse(match[0]);
      s.aiQs=parsed.questions||[];
      if(s.aiQs.length===0) throw new Error('JSON_PARSE');
      s.aiAnswered={};
      break;
    }catch(e){
      if(e.message==='NO_KEY'){
        s.aiQs=[{q:'⚠️ APIキーが設定されていません。上の紫バーにAPIキーを入力して「💾 保存」を押してください。',c:['上のバーで設定する','—','—','—'],a:0,exp:'console.groq.com/keys でGroq APIキーを無料取得できます（1日1,000回・クレカ不要）。'}];
        s.aiAnswered={};break;
      }
      retryCount++;
      if(retryCount>maxRetry){
        s.aiQs=[{q:'問題の生成に失敗しました。もう一度「AI問題を生成」ボタンを押してください。',c:['もう一度試す','—','—','—'],a:0,exp:'AIの応答が不安定でした。再試行すると成功することが多いです。'}];
        s.aiAnswered={};
      }
    }
  }
  s.aiLoading=false;render(tab);
}

function setDiff(tab,d){state[tab].diff=d;render(tab);}
function resetFixed(tab){state[tab].answered={};render(tab);updateScore(tab);}
function resetAll(tab){
  state[tab].answered={};state[tab].aiAnswered={};state[tab].aiQs=[];
  render(tab);updateScore(tab);
}

function renderResult(tab){
  const s=state[tab];
  const qs=QS[tab];
  const correct=Object.values(s.answered).filter(a=>a.ok).length;
  const total=qs.length;
  const pct=Math.round(correct/total*100);
  let emoji='😢',doshi='「間違えた問題の解説を読み返し、弱点を把握しましょう。」';
  if(pct>=80){emoji='🏆';doshi='「素晴らしい！AI出題でさらに実力を磨きましょう！」';}
  else if(pct>=60){emoji='😊';doshi='「あと一歩！解説をしっかり確認してください。」';}
  else if(pct>=40){emoji='😅';doshi='「焦らず一問ずつ解説を読んで理解していこう。」';}
  return `<div class="result">
    <div class="result-emoji">${emoji}</div>
    <div class="result-score">${correct}<span> / ${total}問</span></div>
    <div class="result-pct" style="color:${pct>=60?'var(--purple-mid)':'#ef4444'}">${pct}%</div>
    <div class="doshi"><span class="doshi-lbl">🔥 キャリ爺より</span><p>${doshi}</p></div>
    <button class="btn-retry" onclick="resetFixed('${tab}')">🔄 もう一度解く</button>
  </div>`;
}

function renderAISection(tab){
  const s=state[tab];
  const p=AI_PROMPTS[tab];
  const aiCardsHtml=s.aiQs.length>0
    ?'<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">'
      +s.aiQs.map((q,i)=>renderCard(q,i,s.aiAnswered[i],true,tab)).join('')+'</div>'
    :'';
  const loadHtml=s.aiLoading?'<div class="ai-loading">🤖 AIが問題を生成中...</div>':'';
  return `<div class="ai-section">
    <div class="ai-head">
      <span class="ai-head-icon">🤖</span>
      <div>
        <div class="ai-head-title">AI自動出題コーナー｜${p.label}</div>
        <div class="ai-head-sub">難易度を選んでAIが新問題を5問生成（何度でも可）</div>
      </div>
    </div>
    <div class="ai-body">
      <div class="ai-note">⚠️ AIが生成した問題です。まれに不正確な場合があります。参考程度にご活用ください。</div>
      <div class="ai-controls">
        <span style="font-size:12px;font-weight:700;">難易度：</span>
        <button class="diff-btn diff-normal${s.diff==='normal'?' on':''}" onclick="setDiff('${tab}','normal')">📗 普通</button>
        <button class="diff-btn diff-hard${s.diff==='hard'?' on':''}" onclick="setDiff('${tab}','hard')">📕 難関</button>
        <button class="btn-gen" onclick="generateAI('${tab}')" ${s.aiLoading?'disabled':''}>
          ${s.aiLoading?'⏳ 生成中...':'✨ AI問題を生成（5問）'}
        </button>
      </div>
      ${loadHtml}${aiCardsHtml}
    </div>
  </div>`;
}

function render(tab){
  const s=state[tab];
  const qs=QS[tab];
  const allDone=Object.keys(s.answered).length===qs.length;
  let html='';
  if(allDone){
    html+=renderResult(tab);
  } else {
    html+=`<div class="section-head">📝 問題を解いてみよう<span></span></div>`;
    html+=qs.map((q,i)=>renderCard(q,i,s.answered[i],false,tab)).join('');
  }
  html+=`<div class="powerup">
    <div class="powerup-title">✅ ここまでは、そのまま使えます！</div>
    <div class="powerup-sub">固定問題は<strong>APIキー不要</strong>で今すぐ練習できます。</div>
    <div class="powerup-cta">
      <div class="powerup-cta-title">🚀 AIでパワーアップしよう！</div>
      <div class="powerup-cta-sub">AIが新しい問題を<strong>無制限</strong>に自動生成！<br>
        → 上の紫バーにAPIキーを入力するだけ！<br>
        無料・3分で取得：<a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a>（1日1,000回・クレカ不要）
      </div>
    </div>
  </div>`;
  html+=renderAISection(tab);
  document.getElementById('main-'+tab).innerHTML=html;
}

function renderAll(){
  ['ronri','sakumon'].forEach(tab=>{render(tab);updateScore(tab);});
}
</script>
