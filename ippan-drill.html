<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📰 一般常識完全攻略ドリル｜就活の木</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#b91c1c;--red-mid:#dc2626;--red-pale:#FEF2F2;
  --rose:#9f1239;--rose-mid:#e11d48;
  --amber:#F59E0B;--gray:#6B7280;--white:#fff;
  --shadow:0 2px 8px rgba(0,0,0,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:#FFF1F2;min-height:100vh;color:#1F2937;}

#apiBar{background:linear-gradient(135deg,#7f1d1d,#b91c1c);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:999;}
#apiBar span{color:#fff;font-size:12px;font-weight:700;white-space:nowrap;}
#apiKeyInput{flex:1;min-width:160px;padding:7px 12px;border-radius:8px;border:none;font-size:12px;outline:none;}
.api-btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.api-save{background:#22c55e;color:#fff;}
.api-clear{background:rgba(255,255,255,0.2);color:#fff;}
#apiStatus{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;}

.hero{background:linear-gradient(150deg,#7f1d1d,#dc2626);padding:28px 20px;text-align:center;color:#fff;}
.hero h1{font-size:24px;font-weight:900;margin-bottom:6px;}
.hero p{font-size:13px;opacity:0.85;line-height:1.7;}

.tab-bar{background:#fff;border-bottom:2px solid #E5E7EB;position:sticky;top:44px;z-index:990;display:flex;}
.tab-btn{padding:12px 24px;font-size:13px;font-weight:700;color:var(--gray);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;}
.tab-btn.active{color:var(--red-mid);border-bottom-color:var(--red-mid);}
.tab-btn:hover:not(.active){color:#374151;background:#FFF1F2;}

.content{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.score-bar{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.score-num{font-size:20px;font-weight:900;color:var(--red-mid);}
.score-num span{font-size:12px;color:var(--gray);font-weight:400;}
.progress{flex:1;min-width:100px;height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red-mid),#fb7185);border-radius:4px;transition:width 0.4s;}
.score-pct{font-size:11px;color:var(--gray);}
.btn-reset{padding:6px 12px;background:var(--red-pale);border:1px solid #FECACA;color:var(--red);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}

.q-card{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.q-head{padding:12px 14px 8px;border-bottom:1px solid #F0F0F0;display:flex;gap:8px;align-items:flex-start;}
.q-num{background:var(--red-mid);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;margin-top:2px;flex-shrink:0;}
.q-num.ai{background:#7C3AED;}
.q-num.kokugo{background:var(--rose-mid);}
.q-text{font-size:13px;font-weight:700;line-height:1.65;}
.q-body{padding:10px 14px 12px;}
.choices{display:flex;flex-direction:column;gap:6px;}
.choice{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;border:1.5px solid #E5E7EB;background:#FAFAFA;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.15s;width:100%;text-align:left;}
.choice:hover:not(:disabled){border-color:var(--red-mid);background:var(--red-pale);color:var(--red);}
.choice-lbl{width:20px;height:20px;border-radius:50%;background:#E5E7EB;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:all 0.15s;}
.choice:hover:not(:disabled) .choice-lbl{background:var(--red-mid);color:#fff;}
.choice.ok{border-color:#22c55e;background:#F0FDF4;color:#15803d;}
.choice.ok .choice-lbl{background:#22c55e;color:#fff;}
.choice.ng{border-color:#ef4444;background:#FEF2F2;color:#991b1b;}
.choice.ng .choice-lbl{background:#ef4444;color:#fff;}
.choice.show{border-color:#22c55e;background:#F0FDF4;color:#15803d;}
.choice.show .choice-lbl{background:#22c55e;color:#fff;}
.choice:disabled{cursor:default;}
.exp{margin-top:8px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.75;}
.exp.ok{background:linear-gradient(135deg,#F0FDF4,#DCFCE7);border:1px solid #BBF7D0;color:#14532d;}
.exp.ng{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:1px solid #FDE68A;color:#78350f;}
.exp-head{font-size:11px;font-weight:700;margin-bottom:3px;}

.section-head{font-size:11px;font-weight:700;color:var(--gray);letter-spacing:0.08em;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
.section-head span{flex:1;height:1px;background:#FECACA;display:block;}

.ai-section{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-top:20px;overflow:hidden;}
.ai-head{background:linear-gradient(135deg,#4c1d95,#7c3aed);padding:14px 18px;display:flex;align-items:center;gap:10px;}
.ai-head-icon{font-size:24px;}
.ai-head-title{color:#fff;font-size:14px;font-weight:900;}
.ai-head-sub{color:rgba(255,255,255,0.8);font-size:11px;margin-top:2px;}
.ai-body{padding:16px 18px;}
.ai-note{font-size:11px;color:var(--gray);background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:7px 10px;margin-bottom:12px;}
.ai-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.diff-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.diff-normal{background:#F0FDF4;border-color:#BBF7D0;color:#15803d;}
.diff-normal.on{background:#16a34a;color:#fff;}
.diff-hard{background:#F5F3FF;border-color:#C4B5FD;color:#7C3AED;}
.diff-hard.on{background:#7C3AED;color:#fff;}
.btn-gen{padding:9px 20px;background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.btn-gen:hover{transform:translateY(-2px);}
.btn-gen:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.ai-loading{text-align:center;padding:18px;color:#7C3AED;font-size:13px;font-weight:600;}

.powerup{background:linear-gradient(135deg,#FFF1F2,#FFE4E6);border:2px solid var(--red-mid);border-radius:14px;padding:16px 18px;margin:20px 0;text-align:center;}
.powerup-title{font-size:14px;font-weight:900;color:var(--red);margin-bottom:6px;}
.powerup-sub{font-size:12px;color:#374151;line-height:1.7;margin-bottom:10px;}
.powerup-cta{background:linear-gradient(135deg,#4c1d95,#7c3aed);border-radius:10px;padding:12px 16px;color:#fff;}
.powerup-cta-title{font-size:14px;font-weight:900;margin-bottom:4px;}
.powerup-cta-sub{font-size:12px;opacity:0.9;line-height:1.7;}
.powerup-cta a{color:#fde68a;font-weight:700;}

.result{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:24px;text-align:center;margin-bottom:16px;}
.result-emoji{font-size:44px;margin-bottom:8px;}
.result-score{font-size:38px;font-weight:900;color:var(--red-mid);}
.result-score span{font-size:15px;color:var(--gray);font-weight:400;}
.result-pct{font-size:22px;font-weight:900;margin:4px 0 10px;}
.doshi{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:12px 14px;text-align:left;margin:10px 0;}
.doshi-lbl{font-size:10px;font-weight:700;color:#92400E;margin-bottom:4px;display:block;}
.doshi p{font-size:12px;color:#78350F;font-style:italic;line-height:1.75;}
.btn-retry{padding:10px 24px;background:linear-gradient(135deg,var(--red),var(--red-mid));color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;}

.footer{text-align:center;padding:0 16px 40px;font-size:11px;color:var(--gray);}
.footer b{color:var(--red-mid);}

@media(max-width:480px){
  .hero{padding:22px 14px;}
  .content{padding:16px 12px 50px;}
  .q-text{font-size:12px;}
  .choice{font-size:12px;padding:8px 10px;}
  .tab-btn{padding:10px 14px;font-size:12px;}
}
</style>
</head>
<body>

<div id="apiBar">
  <span>🔑 Gemini APIキー：</span>
  <input id="apiKeyInput" type="password" placeholder="AIzaSy... を入力して保存"/>
  <button class="api-btn api-save" onclick="saveKey()">💾 保存</button>
  <button class="api-btn api-clear" onclick="clearKey()">🗑️</button>
  <span id="apiStatus"></span>
</div>

<div class="hero">
  <h1>📰 一般常識 完全攻略ドリル</h1>
  <p>時事・社会・国語｜2分野まとめて対策<br>固定問題 ＋ AI無限出題（普通・難関）</p>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('jiji',this)">🌐 時事・社会</button>
  <button class="tab-btn" onclick="switchTab('kokugo',this)">📖 国語・語彙</button>
</div>

<div class="content">

  <div id="tab-jiji" class="tab-panel active">
    <div class="score-bar">
      <div>
        <div style="font-size:11px;color:var(--gray);margin-bottom:2px;">スコア</div>
        <div class="score-num" id="score-jiji">0<span> / 0問</span></div>
      </div>
      <div style="flex:1;min-width:100px;">
        <div class="progress"><div class="progress-fill" id="prog-jiji" style="width:0%"></div></div>
        <div class="score-pct" id="pct-jiji" style="margin-top:3px;">0% 正答率</div>
      </div>
      <button class="btn-reset" onclick="resetAll('jiji')">🔄 リセット</button>
    </div>
    <div id="main-jiji"></div>
  </div>

  <div id="tab-kokugo" class="tab-panel">
    <div class="score-bar">
      <div>
        <div style="font-size:11px;color:var(--gray);margin-bottom:2px;">スコア</div>
        <div class="score-num" id="score-kokugo">0<span> / 0問</span></div>
      </div>
      <div style="flex:1;min-width:100px;">
        <div class="progress"><div class="progress-fill" id="prog-kokugo" style="width:0%"></div></div>
        <div class="score-pct" id="pct-kokugo" style="margin-top:3px;">0% 正答率</div>
      </div>
      <button class="btn-reset" onclick="resetAll('kokugo')">🔄 リセット</button>
    </div>
    <div id="main-kokugo"></div>
  </div>

</div>

<div class="footer"><b>🌱 就活の木</b>｜多摩大学キャリア支援課｜キャリ爺作成 ／ <a href="index.html" style="color:var(--red-mid);">← トップに戻る</a></div>

<script>
const QS = {
  jiji: [
    {q:'「カーボンニュートラル」とはどのような状態を指すか。',c:['二酸化炭素を全く排出しない状態','排出する温室効果ガスと吸収量が等しくなる状態','再生可能エネルギーのみを使用する状態','石炭の使用をゼロにする状態'],a:1,exp:'温室効果ガスの排出量と吸収量を均衡させ、実質ゼロにすること。日本は2050年達成を目標。'},
    {q:'「DX（デジタルトランスフォーメーション）」の説明として最も適切なものはどれか。',c:['デジタル機器を購入すること','デジタル技術を活用してビジネス・社会を変革すること','インターネットを使って買い物をすること','AIを研究開発すること'],a:1,exp:'DXはデジタル技術で組織・ビジネスモデルを根本から変革すること。単なる電子化とは異なる。'},
    {q:'「ESG投資」のS（Social）が意味することはどれか。',c:['株式（Stock）への投資','社会的な取り組み（人権・労働環境・地域貢献）','持続可能なエネルギー','科学的分析手法'],a:1,exp:'ESGのS=Social（社会）。人権・労働環境・ダイバーシティ・地域社会への貢献などを評価。'},
    {q:'「ウェルビーイング（Well-being）」の意味として最も適切なものはどれか。',c:['健康診断の結果','身体的・精神的・社会的に良好な状態','給与水準の高さ','福利厚生制度の充実'],a:1,exp:'ウェルビーイングは身体的・精神的・社会的すべてにおいて良好な状態。企業経営にも取り入れられている。'},
    {q:'「GAFA」とは何を指すか。',c:['日本の大手メーカー4社','Google・Amazon・Facebook（Meta）・Appleの4社','政府機関の略称','国際的な環境団体'],a:1,exp:'GAFAはGoogle・Amazon・Facebook（現Meta）・Appleの頭文字。世界的なプラットフォーム企業。'},
    {q:'「リスキリング」とはどのような取り組みか。',c:['リスク管理能力を高めること','新しいスキルを習得し直すこと（学び直し）','外国語を学ぶこと','体力を鍛えること'],a:1,exp:'リスキリング（Reskilling）は技術革新・産業構造の変化に対応するため、新しいスキルを習得し直すこと。'},
    {q:'「生成AI」の説明として最も適切なものはどれか。',c:['人間の代わりに工場で働くロボット','テキスト・画像・音声などを新たに生成できるAI','データを分析するソフトウェア','セキュリティを守るシステム'],a:1,exp:'生成AI（Generative AI）はテキスト・画像・動画・音声などを新たに生成できるAI。ChatGPT・Claude・Geminiなどが代表例。'},
    {q:'「Z世代」とは一般的にどの年代生まれの世代を指すか。',c:['1945〜1960年生まれ','1965〜1980年生まれ','1981〜1996年生まれ','1997年以降生まれ'],a:3,exp:'Z世代は概ね1997年以降生まれ。デジタルネイティブ世代で、SNSや動画コンテンツを中心に情報収集する。'},
    {q:'「サステナビリティ」とはどのような概念か。',c:['企業の短期的な利益最大化','将来の世代のニーズを損なわずに現在のニーズを満たす持続可能性','製品の耐久性の高さ','従業員の勤続年数の長さ'],a:1,exp:'サステナビリティ（持続可能性）は現世代のニーズを満たしながら、将来世代のニーズも損なわない発展を目指す概念。'},
    {q:'「GX（グリーントランスフォーメーション）」とはどのような取り組みか。',c:['緑の植物を増やす環境運動','化石燃料からクリーンエネルギーへの移行・経済社会の変革','緑色をテーマにしたデザイン改革','農業のデジタル化'],a:1,exp:'GXは化石燃料中心の社会構造をクリーンエネルギー中心に転換し、経済成長と環境対策を同時に実現する取り組み。'},
    {q:'「メタバース」とはどのような概念か。',c:['宇宙開発プロジェクト','インターネット上の仮想3D空間・世界','超高速インターネット技術','人工知能の一種'],a:1,exp:'メタバースはインターネット上に構築された仮想3D空間。アバターを使って交流・経済活動ができる。'},
    {q:'「フードロス」とはどのような問題か。',c:['食料の輸送コストが高いこと','まだ食べられる食品が廃棄されること','食料の生産量が不足していること','飲食店の経営が苦しいこと'],a:1,exp:'フードロス（食品ロス）はまだ食べられる食品が廃棄される問題。日本では年間約600万トン発生。'},
    {q:'「働き方改革」で主に推進されていることはどれか。',c:['残業を増やして生産性を上げる','長時間労働の是正・多様な働き方の推進','全員をフリーランスにする','週6日勤務を義務化する'],a:1,exp:'働き方改革は長時間労働の是正、同一労働同一賃金、テレワーク推進など多様で柔軟な働き方の実現。'},
    {q:'「少子高齢化」の説明として正しいものはどれか。',c:['子供の数が増え高齢者が減る現象','出生率の低下と高齢者比率の上昇が同時に進む現象','人口が急激に増加する現象','若者が海外へ流出する現象'],a:1,exp:'少子高齢化は出生率低下（少子化）と高齢者割合増加（高齢化）が同時進行する現象。'},
    {q:'「マイナンバー制度」の主な目的はどれか。',c:['国民を監視するため','行政手続きの効率化・社会保障・税の公平化','選挙の投票管理','外国人の入国管理'],a:1,exp:'マイナンバーは行政手続きの効率化、社会保障の適切な運用、税の公平な徴収を目的とした個人番号制度。'},
  ],
  kokugo: [
    {q:'「忖度（そんたく）」の意味として正しいものはどれか。',c:['強く反発すること','相手の気持ちや意向を推し量ること','率直に意見を言うこと','徹底的に調査すること'],a:1,exp:'「忖度」は他人の心中を推し量ること。近年は上位者の意向を先読みして配慮する意味でも使われる。'},
    {q:'「役不足」の正しい意味はどれか。',c:['その人の力量が仕事に対して足りない','その人の力量に対して仕事・役目が軽すぎる','やる気がないこと','仕事が難しすぎること'],a:1,exp:'「役不足」は本来「役目が軽すぎる」の意。能力不足の意で使うのは誤用。正しくは「力不足」。'},
    {q:'「汚名挽回」という表現は正しいか。',c:['正しい','誤用で「汚名返上」または「名誉挽回」が正しい','文脈によって正しい','新しい表現として定着している'],a:1,exp:'「挽回」は失ったものを取り戻すこと。「汚名」は雪ぐもの。正しくは「汚名返上」か「名誉挽回」。'},
    {q:'「破天荒」の本来の正しい意味はどれか。',c:['豪快で大胆な様子','今まで誰もしなかったことを初めてすること','非常識な行動をとること','天候が荒れること'],a:1,exp:'「破天荒」の本来の意味は「前代未聞・誰も成し遂げなかったことを初めて行う」こと。豪快の意は誤用。'},
    {q:'次のうち敬語の使い方として正しいものはどれか。',c:['先生がおっしゃられた','先生がおっしゃった','先生が申された','先生が言われた'],a:1,exp:'「おっしゃる」は「言う」の尊敬語。「おっしゃられた」は二重敬語で誤り。正しくは「おっしゃった」。'},
    {q:'「煮え湯を飲まされる」の意味として正しいものはどれか。',c:['非常においしいものを食べる','信頼していた人に裏切られひどい目にあう','困難な状況を乗り越える','強い薬を飲む'],a:1,exp:'「煮え湯を飲まされる」は親しい人・信頼していた相手から裏切られることのたとえ。'},
    {q:'四字熟語「起死回生」の意味として正しいものはどれか。',c:['生まれ変わること','死にかけた状態から生き返ること・絶望的な状況を立て直すこと','長い間生き続けること','勝負に勝つこと'],a:1,exp:'「起死回生」は死にかけた者を生き返らせること。転じて絶望的な状況を立て直す逆転策のこと。'},
    {q:'「以心伝心」の意味として正しいものはどれか。',c:['手紙で気持ちを伝えること','言葉を使わずとも心が通じ合うこと','会議で意見をまとめること','友人に秘密を打ち明けること'],a:1,exp:'「以心伝心」は言葉・文字を使わず、心から心へ気持ちが伝わること。禅の言葉から生まれた四字熟語。'},

const AI_PROMPTS = {
  jiji: {
    sys: 'あなたは就職活動の一般常識試験（時事・社会分野）の問題作成専門家です。就活生向けの時事・社会問題（SDGs・DX・AI・ビジネス用語・社会動向）を以下の難易度基準で5問作成してください。【普通】ニュースでよく聞くビジネス用語・基本的なSDGsやDXの知識・就活生なら知っておきたい基礎レベル。【難関】専門的な政策や社会課題・業界固有の知識・複数の時事トピックを関連付けて考えるレベル。必ずJSON形式のみで返答。形式：{"questions":[{"q":"問題文","c":["A","B","C","D"],"a":正解インデックス(0-3),"exp":"解説（80字以内）"}]}',
    label: '一般常識 時事・社会'
  },
  kokugo: {
    sys: 'あなたは就職活動の一般常識試験（国語分野）の問題作成専門家です。就活生向けの国語問題（語彙・慣用句・ことわざ・四字熟語・敬語・誤用）を以下の難易度基準で5問作成してください。【普通】日常語レベルの語彙・基本的な慣用句やことわざ・高校生なら知っているレベル。【難関】難読漢字・マイナーな四字熟語・敬語の複雑な使い分け・誤用が紛らわしいレベル。必ずJSON形式のみで返答。形式：{"questions":[{"q":"問題文","c":["A","B","C","D"],"a":正解インデックス(0-3),"exp":"解説（80字以内）"}]}',
    label: '一般常識 国語・語彙'
  }
};

const KEY = 'shukatsu_gemini_key';
const state = {
  jiji:   { answered:{}, aiAnswered:{}, aiQs:[], diff:'normal', aiLoading:false },
  kokugo: { answered:{}, aiAnswered:{}, aiQs:[], diff:'normal', aiLoading:false },
};

function getKey(){ return sessionStorage.getItem(KEY)||''; }
function saveKey(){
  const k=document.getElementById('apiKeyInput').value.trim();
  if(!k){showSt('❌ キーを入力してください','#fca5a5');return;}
  if(!k.startsWith('AIza')){showSt('⚠️ AIzaSy...で始まるキーを入力','#fde68a');return;}
  sessionStorage.setItem(KEY,k);
  document.getElementById('apiKeyInput').value='';
  showSt('✅ 保存済み！AI出題が使えます','#86efac');
}
function clearKey(){
  sessionStorage.removeItem(KEY);
  showSt('🗑️ 削除しました','#e5e7eb');
}
function showSt(msg,color){
  const el=document.getElementById('apiStatus');
  el.style.color=color;el.textContent=msg;
  setTimeout(()=>{if(el.textContent===msg)el.textContent='';},5000);
}
window.addEventListener('load',()=>{
  if(getKey()) showSt('✅ APIキー設定済み','#86efac');
  renderAll();
});

function switchTab(tab,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

async function callGemini(sys,usr){
  const key=getKey();
  if(!key) throw new Error('NO_KEY');
  const url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key='+key;
  const res=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{role:'user',parts:[{text:sys+'\n\n'+usr}]}],
      generationConfig:{temperature:0.7,maxOutputTokens:8000}
    })
  });
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    if(res.status===400) throw new Error('APIキーが無効です');
    if(res.status===429) throw new Error('Geminiのレート制限に達しました');
    throw new Error((err.error&&err.error.message)||'HTTP '+res.status);
  }
  const reader=res.body.getReader();
  const decoder=new TextDecoder();
  let buffer='',fullText='';
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buffer+=decoder.decode(value,{stream:true});
    const lines=buffer.split('\n');buffer=lines.pop();
    for(const line of lines){
      if(!line.startsWith('data: ')) continue;
      try{
        const evt=JSON.parse(line.slice(6));
        const text=evt?.candidates?.[0]?.content?.parts?.[0]?.text;
        if(text) fullText+=text;
      }catch(_){}
    }
  }
  if(buffer.startsWith('data: ')){
    try{
      const evt=JSON.parse(buffer.slice(6));
      const text=evt?.candidates?.[0]?.content?.parts?.[0]?.text;
      if(text) fullText+=text;
    }catch(_){}
  }
  return fullText;
}

function updateScore(tab){
  const s=state[tab];
  const qs=QS[tab];
  let correct=0,done=0;
  Object.values(s.answered).forEach(a=>{if(a.ok)correct++;done++;});
  Object.values(s.aiAnswered).forEach(a=>{if(a.ok)correct++;done++;});
  document.getElementById('score-'+tab).innerHTML=`${correct}<span> / ${done}問</span>`;
  const pct=done>0?Math.round(correct/done*100):0;
  document.getElementById('prog-'+tab).style.width=Math.min(done/qs.length*100,100)+'%';
  document.getElementById('pct-'+tab).textContent=`${pct}% 正答率（${done}/${qs.length}問回答済み）`;
}

function renderCard(q,i,ans,isAI,tab){
  const done=ans!==undefined;
  const labels=['A','B','C','D'];
  const numCls=isAI?'q-num ai':(tab==='kokugo'?'q-num kokugo':'q-num');
  const numLbl=isAI?`AI-${i+1}`:`Q${i+1}`;
  const choices=q.c.map((c,ci)=>{
    let cls='choice';
    if(done){
      if(ci===q.a) cls+=' show';
      else if(ci===ans.chosen&&!ans.ok) cls+=' ng';
    }
    const fn=isAI?`answerAI('${tab}',${i},${ci})`:`answer('${tab}',${i},${ci})`;
    return `<button class="${cls}" ${done?'disabled':''} onclick="${fn}">
      <span class="choice-lbl">${labels[ci]}</span><span>${c}</span>
    </button>`;
  }).join('');
  let expHtml='';
  if(done){
    const ok=ans.ok;
    expHtml=`<div class="exp ${ok?'ok':'ng'}">
      <div class="exp-head">${ok?'✅ 正解！':`❌ 不正解。正解：「${q.c[q.a]}」`}</div>
      ${q.exp}
    </div>`;
  }
  return `<div class="q-card">
    <div class="q-head"><span class="${numCls}">${numLbl}</span><div class="q-text">${q.q}</div></div>
    <div class="q-body"><div class="choices">${choices}</div>${expHtml}</div>
  </div>`;
}

function answer(tab,qi,chosen){
  state[tab].answered[qi]={chosen,ok:chosen===QS[tab][qi].a};
  render(tab);updateScore(tab);
}
function answerAI(tab,qi,chosen){
  state[tab].aiAnswered[qi]={chosen,ok:chosen===state[tab].aiQs[qi].a};
  render(tab);updateScore(tab);
}

async function generateAI(tab){
  const s=state[tab];
  const p=AI_PROMPTS[tab];
  const diffLabel=s.diff==='hard'?'難関（応用・高難度）':'普通（標準レベル）';
  const usr=`上記の難易度基準で${diffLabel}の問題を5問。必ずJSON形式のみで返答。他のテキスト一切不要。`;
  // ★クリア処理
  s.aiQs=[];s.aiAnswered={};s.aiLoading=true;
  render(tab);
  let retryCount=0;
  const maxRetry=2;
  while(retryCount<=maxRetry){
    try{
      const text=await callGemini(p.sys,usr);
      const match=text.match(/{[\s\S]*}/);
      if(!match) throw new Error('JSON_PARSE');
      const parsed=JSON.parse(match[0]);
      s.aiQs=parsed.questions||[];
      if(s.aiQs.length===0) throw new Error('JSON_PARSE');
      s.aiAnswered={};
      break;
    }catch(e){
      if(e.message==='NO_KEY'){
        s.aiQs=[{q:'⚠️ APIキーが設定されていません。上の紫バーにAPIキーを入力して「💾 保存」を押してください。',c:['上のバーで設定する','—','—','—'],a:0,exp:'aistudio.google.com でAPIキーを無料取得できます。'}];
        s.aiAnswered={};break;
      }
      retryCount++;
      if(retryCount>maxRetry){
        s.aiQs=[{q:'問題の生成に失敗しました。もう一度「AI問題を生成」ボタンを押してください。',c:['もう一度試す','—','—','—'],a:0,exp:'AIの応答が不安定でした。再試行すると成功することが多いです。'}];
        s.aiAnswered={};
      }
    }
  }
  s.aiLoading=false;render(tab);
}

function setDiff(tab,d){state[tab].diff=d;render(tab);}
function resetFixed(tab){state[tab].answered={};render(tab);updateScore(tab);}
function resetAll(tab){
  state[tab].answered={};state[tab].aiAnswered={};state[tab].aiQs=[];
  render(tab);updateScore(tab);
}

function renderResult(tab){
  const s=state[tab];
  const qs=QS[tab];
  const correct=Object.values(s.answered).filter(a=>a.ok).length;
  const total=qs.length;
  const pct=Math.round(correct/total*100);
  let emoji='😢',doshi='「間違えた問題の解説を読み返し、弱点を把握しましょう。」';
  if(pct>=80){emoji='🏆';doshi='「素晴らしい！AI出題でさらに実力を磨きましょう！」';}
  else if(pct>=60){emoji='😊';doshi='「あと一歩！解説をしっかり確認してください。」';}
  else if(pct>=40){emoji='😅';doshi='「焦らず一問ずつ解説を読んで理解していこう。」';}
  return `<div class="result">
    <div class="result-emoji">${emoji}</div>
    <div class="result-score">${correct}<span> / ${total}問</span></div>
    <div class="result-pct" style="color:${pct>=60?'var(--red-mid)':'#ef4444'}">${pct}%</div>
    <div class="doshi"><span class="doshi-lbl">🔥 キャリ爺より</span><p>${doshi}</p></div>
    <button class="btn-retry" onclick="resetFixed('${tab}')">🔄 もう一度解く</button>
  </div>`;
}

function renderAISection(tab){
  const s=state[tab];
  const p=AI_PROMPTS[tab];
  const aiCardsHtml=s.aiQs.length>0
    ?'<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">'
      +s.aiQs.map((q,i)=>renderCard(q,i,s.aiAnswered[i],true,tab)).join('')+'</div>'
    :'';
  const loadHtml=s.aiLoading?'<div class="ai-loading">🤖 AIが問題を生成中...</div>':'';
  return `<div class="ai-section">
    <div class="ai-head">
      <span class="ai-head-icon">🤖</span>
      <div>
        <div class="ai-head-title">AI自動出題コーナー｜${p.label}</div>
        <div class="ai-head-sub">難易度を選んでAIが新問題を5問生成（何度でも可）</div>
      </div>
    </div>
    <div class="ai-body">
      <div class="ai-note">⚠️ AIが生成した問題です。まれに不正確な場合があります。参考程度にご活用ください。</div>
      <div class="ai-controls">
        <span style="font-size:12px;font-weight:700;">難易度：</span>
        <button class="diff-btn diff-normal${s.diff==='normal'?' on':''}" onclick="setDiff('${tab}','normal')">📗 普通</button>
        <button class="diff-btn diff-hard${s.diff==='hard'?' on':''}" onclick="setDiff('${tab}','hard')">📕 難関</button>
        <button class="btn-gen" onclick="generateAI('${tab}')" ${s.aiLoading?'disabled':''}>
          ${s.aiLoading?'⏳ 生成中...':'✨ AI問題を生成（5問）'}
        </button>
      </div>
      ${loadHtml}${aiCardsHtml}
    </div>
  </div>`;
}

function render(tab){
  const s=state[tab];
  const qs=QS[tab];
  const allDone=Object.keys(s.answered).length===qs.length;
  let html='';
  if(allDone){
    html+=renderResult(tab);
  } else {
    html+=`<div class="section-head">📝 問題を解いてみよう<span></span></div>`;
    html+=qs.map((q,i)=>renderCard(q,i,s.answered[i],false,tab)).join('');
  }
  html+=`<div class="powerup">
    <div class="powerup-title">✅ ここまでは、そのまま使えます！</div>
    <div class="powerup-sub">固定問題は<strong>APIキー不要</strong>で今すぐ練習できます。</div>
    <div class="powerup-cta">
      <div class="powerup-cta-title">🚀 AIでパワーアップしよう！</div>
      <div class="powerup-cta-sub">AIが新しい問題を<strong>無制限</strong>に自動生成！<br>
        → 上の紫バーにAPIキーを入力するだけ！<br>
        無料・3分で取得：<a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a>
      </div>
    </div>
  </div>`;
  html+=renderAISection(tab);
  document.getElementById('main-'+tab).innerHTML=html;
}

function renderAll(){
  ['jiji','kokugo'].forEach(tab=>{render(tab);updateScore(tab);});
}
